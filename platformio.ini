; Cerberus — Teensy tri-CAN OBD interface for VAG.
; Two build targets, same source + feature set: teensy41 (default dev board) and
; teensy40 (compact 2-head unit). Pick the board you're flashing.
;   pio run                      -> builds the default (teensy41)
;   pio run -e teensy40          -> builds the 4.0 hex
;   pio run -e teensy41 -t upload-> flash the 4.1
[platformio]
default_envs = teensy41

[env]
platform = teensy
framework = arduino
monitor_speed = 115200
; USB_DUAL_SERIAL = two CDC ports: Serial (smart command/CAN) + SerialUSB1 (always-raw
; K-line KKL cable for NefMoto/VCDS-dumb/etc.). The board appears as two COM ports.
build_flags = -D USB_DUAL_SERIAL
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    greiman/SSD1306Ascii        ; optional 0.91/0.92" OLED status HUD (auto-detected)

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40
