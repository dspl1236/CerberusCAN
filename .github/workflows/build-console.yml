name: Build CerberusConsole.exe

# Auto-release: on every push to main that touches the app/firmware, read CONSOLE_VERSION
# and — if that version hasn't been released yet — build the single-file exe, create the
# tag `console-v<version>`, publish the Release, and prune to the newest few.
# Convention: bump CONSOLE_VERSION in host/cerberus_console.py for any release-worthy
# change (console OR bundled firmware), and CI does the rest. Manual run also available.
on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - "firmware/*.hex"
      - ".github/workflows/build-console.yml"
  workflow_dispatch:

permissions:
  contents: write          # create tags/releases + prune old ones

concurrency:
  group: build-console
  cancel-in-progress: false

env:
  KEEP_RELEASES: "5"       # how many console-v* releases to retain (3-5)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Decide whether this CONSOLE_VERSION still needs a release (skip if already tagged).
      - name: Decide release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oE 'CONSOLE_VERSION = "[^"]+"' host/cerberus_console.py | grep -oE '[0-9][^"]+')
          tag="console-v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already released — skipping."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"

      # --- everything below only runs when there's a new version to ship ---
      - name: Build teensy_loader_cli            # native HID (setupapi/hid) — no libusb
        if: steps.decide.outputs.release == 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make git
      - name: Compile flasher
        if: steps.decide.outputs.release == 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/PaulStoffregen/teensy_loader_cli
          cd teensy_loader_cli
          # Modern mingw-w64 ships the HID headers top-level (<hidsdi.h>), not under the
          # legacy <ddk/...> path the source uses; rewrite the include. CC=gcc forces the
          # native MINGW64 toolchain (bare `cc` resolves to the wrong MSYS POSIX gcc).
          sed -i 's@ddk/hid@hid@g' teensy_loader_cli.c
          make CC=gcc OS=WINDOWS
          mkdir -p ../host/tools
          cp teensy_loader_cli.exe ../host/tools/
          # bundle the GPLv3 license (filename varies upstream); fall back to a pointer
          cp LICENSE ../host/tools/LICENSE-teensy_loader_cli.txt 2>/dev/null \
            || cp COPYING ../host/tools/LICENSE-teensy_loader_cli.txt 2>/dev/null \
            || cp LICENSE.* ../host/tools/LICENSE-teensy_loader_cli.txt 2>/dev/null \
            || echo "teensy_loader_cli is GPLv3 — https://github.com/PaulStoffregen/teensy_loader_cli" \
                 > ../host/tools/LICENSE-teensy_loader_cli.txt

      - name: Setup Python
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        if: steps.decide.outputs.release == 'true'
        run: pip install pyinstaller pyserial

      - name: Build the exe
        if: steps.decide.outputs.release == 'true'
        shell: cmd
        run: cd host && build_exe.bat

      - name: Stage artifact
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p out
          cp "host/dist/CerberusConsole.exe" "out/CerberusConsole-v${{ steps.decide.outputs.version }}.exe"

      - name: Publish release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.decide.outputs.tag }}
          name: CerberusConsole v${{ steps.decide.outputs.version }}
          body: |
            Single-file Windows build of CerberusConsole (sniff · diagnostics · one-click firmware).
            Bundles both Teensy 4.0/4.1 hexes + `teensy_loader_cli` (GPLv3) — no Python needed.
            Auto-built from `main` at ${{ github.sha }}.
          files: out/CerberusConsole-v${{ steps.decide.outputs.version }}.exe

      # Deliberately NOT gated on `release == 'true'`: cleanup is idempotent housekeeping,
      # not part of publishing. Running it every time means a manual `workflow_dispatch`
      # can clean up a repo that has already drifted, instead of the backlog sitting there
      # until the next version bump happens to come along.
      - name: Prune old releases            # keep only the newest KEEP_RELEASES console-v*
        continue-on-error: true             # best-effort cleanup: never fail the release over it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          rc=0

          # Count the releases the API reports PLUS the one we just published. A
          # freshly-created release can lag in `gh release list`, and when it did the
          # old ".[keep:]" slice came back empty, nothing was pruned, and the repo
          # settled at KEEP+1 releases forever (6 against KEEP_RELEASES=5).
          # Order by VERSION, not createdAt, so a lagging or re-written timestamp
          # cannot reorder the list. sort -V puts the OLDEST first.
          tags=$( { gh release list --limit 100 --json tagName --jq '.[].tagName'; echo "$NEW_TAG"; } \
                  | grep '^console-v' | sort -u -V )
          n=$(printf '%s\n' "$tags" | grep -c .)
          echo "$n console-v release(s); keeping the newest ${KEEP_RELEASES}"

          if [ "$n" -gt "${KEEP_RELEASES}" ]; then
            for t in $(printf '%s\n' "$tags" | head -n "$(( n - KEEP_RELEASES ))"); do
              echo "pruning $t"
              gh release delete "$t" --cleanup-tag --yes \
                || { echo "::warning::could not delete release $t"; rc=1; }
              # --cleanup-tag has been observed to leave the tag behind (console-v0.9.17
              # outlived its release that way). Confirm, and remove the ref if it did.
              if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" \
                  && echo "  removed leftover tag $t" \
                  || { echo "::warning::release $t deleted but its tag remains"; rc=1; }
              fi
            done
          fi

          # Sweep historical orphans: any console-v* tag with no release behind it.
          live=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          for t in $(git ls-remote --tags origin 'refs/tags/console-v*' \
                     | sed 's@.*refs/tags/@@; s@\^{}@@' | sort -u -V); do
            printf '%s\n' "$live" | grep -qx "$t" && continue
            echo "removing orphan tag $t (no release)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" \
              || { echo "::warning::could not delete orphan tag $t"; rc=1; }
          done

          # Surface failures as annotations. continue-on-error keeps the RELEASE green;
          # what it must not do is hide a broken prune the way the old `exit 0` did.
          exit $rc
