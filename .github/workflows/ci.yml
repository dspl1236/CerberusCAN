name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware:
    name: Build Teensy 4.1 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
